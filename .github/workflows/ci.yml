name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25', cache: true }
      - name: go.mod matches the pinned toolchain
        run: |
          declared=$(awk '/^go /{print $2; exit}' go.mod)
          if [ "${declared%.*}" != "1.25" ]; then
            echo "::error::go.mod declares go $declared but CI pins 1.25. GOTOOLCHAIN=auto would silently download $declared and build on it, so the pin would test nothing. Run: go mod edit -go=1.25.0 (a go get on a newer toolchain re-raises this)."
            exit 1
          fi
      - run: go build ./...
      # vet WITH the build tag: `go vet ./...` silently skips //go:build
      # integration files, which in this platform is most of the test code —
      # the double-spend hammer and the property suite among it.
      - name: vet (including integration-tagged code)
        run: |
          go vet ./...
          go vet -tags=integration ./...

      # staticcheck finds what vet does not. Pinned so a new release cannot
      # turn CI red without a commit.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          staticcheck ./...
          staticcheck -tags=integration ./...

      # Known CVEs in dependencies. This one CAN go red with no code change —
      # that is the point: a vulnerability published today is news today, and
      # on a licensed money platform it is a compliance question, not a chore.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - run: go test -race -count=1 ./...

  # The conformance suite is only half-run without this: the fakes prove nothing
  # about the SQL, and it was exactly that gap that let a tenant-blind inbox key
  # ship green.
  integration:
    name: integration (postgres 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ocean_platform_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ocean_platform_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25', cache: true }
      - run: go test -tags=integration -race -count=1 -p 1 ./...
